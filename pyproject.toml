[project]
name = "short-rate-anomaly-regimes"
version = "0.1.0"
description = "Replication and regime extension of short-rate asset-pricing anomaly models"
authors = [{ name = "Diogo Ribeiro", email = "diogo_dj@hotmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<4.0"
keywords = [
  "asset-pricing",
  "econometrics",
  "empirical-finance",
  "monetary-policy",
  "replication",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.1,<3.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.14,<2.0",
  "statsmodels>=0.14,<0.15",
  "linearmodels>=6.1,<7.0",
  "arch>=7.2,<8.0",
  "pyarrow>=23.0.1,<24.0",
  "duckdb>=1.1,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "typer>=0.15,<0.16",
  "rich>=13.9,<14.0",
  "requests>=2.32,<3.0",
  "pandas-datareader>=0.10,<0.11",
  "fredapi>=0.5,<0.6",
  "matplotlib>=3.10,<4.0",
  "openpyxl>=3.1,<4.0",
  "jinja2>=3.1,<4.0",
]

[project.urls]
Repository = "https://github.com/DiogoRibeiro7/short-rate-anomaly-regimes"

[project.scripts]
srar = "short_rate_anomaly_regimes.cli:app"

[tool.poetry]
packages = [{ include = "short_rate_anomaly_regimes", from = "src" }]
include = ["src/short_rate_anomaly_regimes/py.typed"]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0"
pytest-cov = "^6.0"
hypothesis = "^6.123"
ruff = "^0.9"
mypy = "^1.14"
pandas-stubs = "^2.2"
types-pyyaml = "^6.0"
types-requests = "^2.32"
pre-commit = "^4.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=short_rate_anomaly_regimes --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests requiring downloaded public data",
  "restricted: tests requiring licensed or author-provided data",
  "slow: computationally expensive tests",
]

[[tool.mypy.overrides]]
module = ["statsmodels.*"]
ignore_missing_imports = true
