[tool.poetry]
name = "short-rate-anomaly-regimes"
version = "0.1.0"
description = "Replication and regime extension of short-rate asset-pricing anomaly models"
authors = ["Diogo"]
readme = "README.md"
packages = [{ include = "short_rate_anomaly_regimes", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.1"
pandas = "^2.2"
scipy = "^1.14"
statsmodels = "^0.14"
linearmodels = "^6.1"
arch = "^7.2"
pyarrow = "^18.0"
duckdb = "^1.1"
pydantic = "^2.10"
pydantic-settings = "^2.7"
pyyaml = "^6.0"
typer = "^0.15"
rich = "^13.9"
requests = "^2.32"
pandas-datareader = "^0.10"
fredapi = "^0.5"
matplotlib = "^3.10"
openpyxl = "^3.1"
jinja2 = "^3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
hypothesis = "^6.123"
ruff = "^0.9"
mypy = "^1.14"
pandas-stubs = "^2.2"
types-pyyaml = "^6.0"
types-requests = "^2.32"
pre-commit = "^4.1"

[tool.poetry.scripts]
srar = "short_rate_anomaly_regimes.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=short_rate_anomaly_regimes --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "integration: tests requiring downloaded public data",
  "restricted: tests requiring licensed or author-provided data",
  "slow: computationally expensive tests",
]
