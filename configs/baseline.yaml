project:
  name: short-rate-anomaly-regimes
  replication_mode: strict
  random_seed: 20260727

sample:
  frequency: monthly
  start: "1972-01"
  end: "2013-12"
  date_alignment: month_end

returns:
  units: percent_per_month
  excess_return_definition: portfolio_return_minus_one_month_tbill_return
  weighting: value_weighted

market_factor:
  source_id: french_mkt_rf
  column: Mkt-RF

short_rate:
  primary_series: federal_funds_rate
  alternatives:
    - treasury_bill_rate
  innovation:
    model: ar1_with_intercept
    estimation: full_sample
    residual_timing: contemporaneous
    standardize: false
    timing_variant: pre_window_lag
    timing_variant_sensitivity: within_window_lag
    timing_variant_evidence: >-
      The article does not state which month supplies the first lagged rate.
      Only the pre-window lag, which draws the 1971-12 level, reproduces the
      published slope at its printed precision, both published t-ratios, the
      published R-squared, and all five Table 1 innovation statistics for both
      rates. See artifacts/tables/factors/ar1_published_target_comparison.csv.
    intercept_comparison_units: decimal_rate_units

# The article's baseline test assets are seven value-weighted decile families
# (article pages 936-937), stacked as the 70-portfolio system. The size-sorted
# 25-portfolio double sorts previously listed here are Internet Appendix Section
# 2.6 / Table A.7 supplement robustness sets, are not acquired, and are not the
# baseline test assets. Listing them here also left
# _compatible_extension_portfolio_sets with an empty intersection against
# configs/extensions.yaml, which silently removed the temporal-extension
# portfolio requirement.
portfolio_sets:
  - book_to_market
  - earnings_to_price
  - equity_duration
  - long_term_reversal
  - investment_to_assets
  - ppe_investment
  - inventory_growth

# Supplement-only robustness sets, not acquired and not baseline test assets.
supplement_portfolio_sets:
  - size_book_to_market_25
  - size_asset_growth_25
  - size_long_term_reversal_25

asset_pricing:
  time_series:
    include_intercept: true
    covariance: newey_west
    nw_lags: automatic
  cross_section:
    estimators:
      - ols_two_pass
      - gls_two_pass
      - fama_macbeth
    include_zero_beta_intercept: false
    shanken_correction: true
    weak_factor_diagnostics: true

comparators:
  - capm
  - fama_french_3
  - carhart_4
  - fama_french_5
  - q_factor
  - liquidity

reporting:
  decimals: 4
  t_stat_decimals: 2
  significance_levels: [0.10, 0.05, 0.01]
