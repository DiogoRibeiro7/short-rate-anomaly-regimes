data_freeze:
  baseline_start: "1972-01"
  baseline_end: "2013-12"
  extension_start: "2014-01"
  # Set by the acquired anomaly decile panels, which end 2025-12. The rate series
  # run to 2026-06 and the Kenneth French factors to 2026-05, so the portfolio
  # sample, not the rate or factor data, is the binding common endpoint. See
  # research/anomaly_portfolio_availability.csv and
  # reports/baseline_input_readiness.md.
  latest_common_month: "2025-12"
  retrieval_date: "2026-07-31"
  baseline_vintage_label: locked_original_1972_2013
  extension_vintage_label: extension_retrieved_2026_07_31
  revision_policy: audit_separately
  # The seven acquired anomaly decile families. The 25-portfolio double sorts
  # previously listed here are not acquired at any vintage, so they cannot carry
  # a post-publication extension.
  compatible_portfolio_sets:
    - book_to_market
    - earnings_to_price
    - equity_duration
    - long_term_reversal
    - investment_to_assets
    - ppe_investment
    - inventory_growth

shock_decomposition:
  enabled: true
  selected_dataset_id: jarocinski_karadi_fed_shocks_update_202401
  selected_dataset_source: https://github.com/marekjarocinski/jkshocks_update_fed_202401
  raw_event_path: data/raw/shocks/jarocinski_karadi_fed_events.csv
  identification:
    primary: poor_mans_sign_restriction
    alternatives:
      - futures_surprise_only
      - external_instrument_svar
  event_window_minutes: 30
  aggregation: monthly_sum
  preserve_policy_and_information_components: true

out_of_sample:
  initial_train_end: "1999-12"
  expanding_window: true
  refit_frequency_months: 12
  confirmatory_model: two_factor_market_rate
  factor_definition: mkt,rate
  benchmarks:
    - historical_mean
    - zero_excess_return
  evaluation:
    - cross_sectional_rmse
    - mean_absolute_pricing_error
    - maximum_absolute_alpha
    - out_of_sample_r2
    - directional_rank_accuracy

robustness:
  rate_innovation_models:
    - ar1_with_intercept
    - ar2_with_intercept
    - local_level_state_space
    - survey_or_futures_surprise
  covariance_estimators:
    - newey_west
    - stationary_bootstrap
  portfolio_weightings:
    - value_weighted
    - equal_weighted
  influential_observation_methods:
    - leave_one_crisis_out
    - leave_one_year_out
    - dfbeta
