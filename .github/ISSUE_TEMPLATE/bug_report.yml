name: Bug Report
description: Report a reproducible defect in code, documentation, or workflow.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, inputs, and environment needed to reproduce the issue.
      value: |
        ```bash
        ```
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Relevant Output
      description: Paste the shortest useful error output or traceback.
